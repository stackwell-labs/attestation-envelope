# amber-ci jobs for attestation-envelope (spec: stackwell-labs/amber-ci
# docs/design.md §2; how to onboard: docs/onboarding.md there; started from
# templates/rust-lib.toml).
#
# The crate has no GitHub workflow, so this runs its whole test suite twice:
# default features (the EdDSA path every consumer gets), then --all-features,
# which adds the `kms` module and its offline DER/SPKI conversion tests (no
# AWS call is made; KmsNotary::new is never exercised by a test).
#
# Cargo.lock is gitignored (a library's lock is not the one its consumers
# build with), so cargo resolves the newest compatible deps on every run:
# no --locked, and no `reuse`, because the result is not a function of the
# tree alone. Without reuse the job keeps its network, so no `fetch` phase.

version = 1

[job.test]
image = "docker.io/library/rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073"
run = [
  "cargo test --no-fail-fast",
  "cargo test --all-features --no-fail-fast",
]
required_for_main = true
timeout_minutes = 30
cache = "rust-1.97.0"

[job.test.env]
CARGO_HOME = "/cache/cargo"
CARGO_TARGET_DIR = "/cache/target"
