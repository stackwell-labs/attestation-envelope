[package]
name = "attestation-envelope"
version = "0.1.0"
edition = "2021"
description = "The shared detached-JWS (Ed25519 / EdDSA) attestation envelope: one audited sign/verify over JCS-canonical cores, plus the notary signing key + JWKS. Generic over the signed core type."
license = "MIT OR Apache-2.0"
repository = "https://github.com/stackwell-labs/attestation-envelope"
readme = "README.md"
keywords = ["jws", "ed25519", "attestation", "provenance"]
categories = ["cryptography", "authentication"]

[dependencies]
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
